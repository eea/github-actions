name: Test betterleaks

on:
  push:
    paths:
      - betterleaks/**
      - .github/workflows/test-betterleaks.yml
  pull_request:
    paths:
      - betterleaks/**
      - .github/workflows/test-betterleaks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "mention-author: unit tests with a fake gh"
        run: betterleaks/tests/mention-author.test.sh

      - name: Create fixture repo with a fake leak in the latest commit
        run: betterleaks/tests/make-fixture.sh fixture

      # --- git mode -----------------------------------------------------------

      - name: "git mode: scan leaking commit"
        id: git_leak
        uses: ./betterleaks
        with:
          mode: git
          path: fixture
          fail-on-leak: "false"
          upload-report: "false"

      - name: "git mode: assert leak detected and redacted"
        env:
          RESULT: ${{ steps.git_leak.outputs.result }}
          LEAKS: ${{ steps.git_leak.outputs.leaks }}
          REPORT: ${{ steps.git_leak.outputs.report-path }}
          COMMIT: ${{ steps.git_leak.outputs.commit }}
        run: |
          test "$RESULT" = "leaks" || { echo "expected result=leaks, got '$RESULT'"; exit 1; }
          test "$LEAKS" -ge 1 || { echo "expected a leak, got '$LEAKS'"; exit 1; }
          jq -e 'any(.[]; .RuleID == "github-pat")' "$REPORT"
          ! grep -q 'ghp_' "$REPORT" || { echo "token not redacted"; exit 1; }
          test "$COMMIT" = "$(git -C fixture rev-parse HEAD)" || { echo "commit output '$COMMIT' is not the fixture HEAD"; exit 1; }

      - name: "git mode: assert report is outside the workspace"
        env:
          REPORT: ${{ steps.git_leak.outputs.report-path }}
        run: |
          [[ "$REPORT" == "$RUNNER_TEMP"/* ]] || { echo "report not under RUNNER_TEMP: $REPORT"; exit 1; }
          if find "$GITHUB_WORKSPACE" -name betterleaks-report.json | grep -q .; then
            echo "report written into the workspace"; exit 1
          fi

      - name: Add clean commit on top
        working-directory: fixture
        run: |
          echo more >> a.txt
          git commit -qam clean

      - name: "git mode: scan clean commit"
        id: git_clean
        uses: ./betterleaks
        with:
          mode: git
          path: fixture
          fail-on-leak: "false"
          upload-report: "false"

      - name: "git mode: assert only the latest commit is scanned"
        env:
          LEAKS: ${{ steps.git_clean.outputs.leaks }}
          RC: ${{ steps.git_clean.outputs.exit-code }}
        run: |
          if [[ "$LEAKS" != "0" || "$RC" != "0" ]]; then
            echo "expected clean scan, got leaks=$LEAKS exit=$RC"
            exit 1
          fi

      # --- dir mode -----------------------------------------------------------

      - name: "dir mode: scan the whole tree (leak is still in values.yaml)"
        id: dir_leak
        uses: ./betterleaks
        with:
          path: fixture
          fail-on-leak: "false"
          upload-report: "false"

      - name: "dir mode: assert leak detected"
        env:
          REPORT: ${{ steps.dir_leak.outputs.report-path }}
        run: jq -e 'any(.[]; .RuleID == "github-pat" and .File == "values.yaml")' "$REPORT"

      # --- EEA base config layered with the repo config -----------------------

      - name: Create fixture with a repo allowlist and forbidden files
        run: |
          mkdir -p layered/allowed
          printf 'not a key\n' > layered/allowed/example.pem
          printf 'not a key\n' > layered/server.pem
          cat > layered/.gitleaks.toml <<'TOML'
          title = "repo config"

          [extend]
          useDefault = true

          [[allowlists]]
          description = "Repo-specific allowlist"
          paths = ['''^allowed/''']
          TOML

      - name: "layered: scan"
        id: layered
        uses: ./betterleaks
        with:
          path: layered
          fail-on-leak: "false"
          upload-report: "false"

      - name: "layered: assert base rule applies and repo allowlist is honoured"
        env:
          REPORT: ${{ steps.layered.outputs.report-path }}
        run: |
          jq -e '[.[] | select(.RuleID == "forbidden-secret-file") | .File] == ["server.pem"]' "$REPORT" \
            || { jq '.[] | {RuleID, File}' "$REPORT"; exit 1; }

      - name: "layered: scan without the base config"
        id: nobase
        uses: ./betterleaks
        with:
          path: layered
          base-config: "false"
          fail-on-leak: "false"
          upload-report: "false"

      - name: "layered: assert EEA rules are off with base-config false"
        env:
          LEAKS: ${{ steps.nobase.outputs.leaks }}
        run: test "$LEAKS" = "0" || { echo "expected 0 leaks without base config, got $LEAKS"; exit 1; }

      - name: Create fixture with $PWD bind mounts, a required-variable check and a real pwd secret
        run: |
          mkdir -p pwdmount
          cat > pwdmount/run.sh <<'SCRIPT'
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt image
          : "${API_TOKEN:?API_TOKEN is required}"
          SCRIPT
          key="pwd"   # built at runtime so this workflow holds no secret-like literal
          echo "${key}=$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 16)" >> pwdmount/run.sh

      - name: "bind mount: scan"
        id: pwdmount
        uses: ./betterleaks
        with:
          path: pwdmount
          fail-on-leak: "false"
          upload-report: "false"

      - name: "bind mount: assert the mount and the :? check are allowed and the secret is not"
        env:
          REPORT: ${{ steps.pwdmount.outputs.report-path }}
        run: |
          jq -e '[.[] | .StartLine] == [3]' "$REPORT" || { jq '.[] | {RuleID, StartLine}' "$REPORT"; exit 1; }

      # --- what shows on the check: annotations and job summary ---------------
      # scan.sh is called directly so its stdout (annotation commands) and the
      # summary file can be inspected; printed output is defused with "> ".

      - name: "check output: leak is annotated at file and line, summary lists it"
        run: |
          image="$(sed -n 's/^[[:space:]]*BETTERLEAKS_IMAGE:[[:space:]]*//p' betterleaks/action.yml)"
          out="$(REPO_DIR="$GITHUB_WORKSPACE" OUT_DIR="$RUNNER_TEMP/annotate" SCAN_PATH=fixture \
            BETTERLEAKS_IMAGE="$image" GITHUB_OUTPUT="$RUNNER_TEMP/annotate.out" \
            GITHUB_STEP_SUMMARY="$RUNNER_TEMP/annotate.md" betterleaks/scripts/scan.sh)"
          if ! grep -q '^::error file=fixture/values.yaml,line=2,endLine=2,title=Betterleaks%3A github-pat::' <<<"$out"; then
            awk '{ print "> " $0 }' <<<"$out"; exit 1
          fi
          grep -q '^## Betterleaks: 1 potential secret' "$RUNNER_TEMP/annotate.md"
          grep -qE '^\| .github-pat. \| .values\.yaml. \| 2 \|$' "$RUNNER_TEMP/annotate.md"
          if grep -q 'ghp_' "$RUNNER_TEMP/annotate.md" || grep -q 'ghp_' <<<"$out"; then
            echo "token not redacted"; exit 1
          fi

      - name: "check output: clean scan adds a notice"
        run: |
          mkdir -p clean && echo "nothing to see" > clean/readme.txt
          image="$(sed -n 's/^[[:space:]]*BETTERLEAKS_IMAGE:[[:space:]]*//p' betterleaks/action.yml)"
          out="$(REPO_DIR="$GITHUB_WORKSPACE" OUT_DIR="$RUNNER_TEMP/clean" SCAN_PATH=clean \
            BETTERLEAKS_IMAGE="$image" GITHUB_OUTPUT="$RUNNER_TEMP/clean.out" \
            GITHUB_STEP_SUMMARY="$RUNNER_TEMP/clean.md" betterleaks/scripts/scan.sh)"
          grep -q '^::notice title=Betterleaks::No secrets found' <<<"$out" || { awk '{ print "> " $0 }' <<<"$out"; exit 1; }
          grep -q '^## Betterleaks: no secrets found' "$RUNNER_TEMP/clean.md"

      # --- baseline: known findings are ignored, new ones still fail ----------

      - name: Create fixture with a known leak and its baseline
        run: |
          mkdir -p baselined
          echo "token: ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > baselined/old.yaml
          image="$(sed -n 's/^[[:space:]]*BETTERLEAKS_IMAGE:[[:space:]]*//p' betterleaks/action.yml)"
          REPO_DIR="$GITHUB_WORKSPACE" OUT_DIR="$RUNNER_TEMP/baseline" SCAN_PATH=baselined BASELINE='' \
            BETTERLEAKS_IMAGE="$image" betterleaks/scripts/scan.sh > /dev/null
          cp "$RUNNER_TEMP/baseline/betterleaks-report.json" baselined/.betterleaks-baseline.json

      - name: "baseline: scan with only the known leak"
        id: baseline_known
        uses: ./betterleaks
        with:
          path: baselined
          fail-on-leak: "false"
          upload-report: "false"

      - name: Add a new leak next to the known one
        run: |
          echo "token: ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > baselined/new.yaml

      - name: "baseline: scan with a new leak"
        id: baseline_new
        uses: ./betterleaks
        with:
          path: baselined
          fail-on-leak: "false"
          upload-report: "false"

      - name: "baseline: assert the known leak is ignored and the new one is reported"
        env:
          KNOWN: ${{ steps.baseline_known.outputs.result }}
          NEW_RESULT: ${{ steps.baseline_new.outputs.result }}
          REPORT: ${{ steps.baseline_new.outputs.report-path }}
        run: |
          test "$KNOWN" = "clean" || { echo "known leak was reported ($KNOWN)"; exit 1; }
          test "$NEW_RESULT" = "leaks" || { echo "new leak was not reported ($NEW_RESULT)"; exit 1; }
          jq -e '[.[].File] == ["new.yaml"]' "$REPORT"

      # --- a scan that read nothing is an error, not a clean result -----------

      - name: Create an empty folder
        run: mkdir -p empty-folder

      - name: "zero bytes: dir scan of the empty folder"
        id: zero_scan
        continue-on-error: true
        uses: ./betterleaks
        with:
          path: empty-folder
          upload-report: "false"

      - name: "zero bytes: assert it failed instead of reporting clean"
        env:
          OUTCOME: ${{ steps.zero_scan.outcome }}
          RESULT: ${{ steps.zero_scan.outputs.result }}
        run: |
          test "$OUTCOME" = "failure" || { echo "expected failure, got $OUTCOME"; exit 1; }
          test -z "$RESULT" || { echo "a result was reported: $RESULT"; exit 1; }

      # --- invalid input and infrastructure errors ----------------------------

      - name: "invalid input: mode"
        id: bad_mode
        continue-on-error: true
        uses: ./betterleaks
        with:
          mode: foo
          path: fixture
          upload-report: "false"

      - name: "invalid input: fail-on-leak"
        id: bad_bool
        continue-on-error: true
        uses: ./betterleaks
        with:
          path: fixture
          fail-on-leak: "yes"
          upload-report: "false"

      - name: "invalid input: timeout-minutes"
        id: bad_timeout
        continue-on-error: true
        uses: ./betterleaks
        with:
          path: fixture
          timeout-minutes: "0"
          upload-report: "false"

      - name: "invalid input: mention-author"
        id: bad_mention
        continue-on-error: true
        uses: ./betterleaks
        with:
          path: fixture
          mention-author: "yes"
          upload-report: "false"

      - name: "invalid input: path outside the workspace"
        id: bad_path
        continue-on-error: true
        uses: ./betterleaks
        with:
          path: ../..
          upload-report: "false"

      - name: "invalid input: assert each one failed"
        env:
          MODE: ${{ steps.bad_mode.outcome }}
          BOOL: ${{ steps.bad_bool.outcome }}
          PATH_OUTCOME: ${{ steps.bad_path.outcome }}
          TIMEOUT: ${{ steps.bad_timeout.outcome }}
          MENTION: ${{ steps.bad_mention.outcome }}
        run: |
          for o in "mode=$MODE" "fail-on-leak=$BOOL" "path=$PATH_OUTCOME" "timeout-minutes=$TIMEOUT" "mention-author=$MENTION"; do
            [[ "${o#*=}" == "failure" ]] || { echo "invalid ${o%%=*} was accepted (${o#*=})"; exit 1; }
          done

      - name: "infrastructure: image pull failure is an error, not a leak"
        run: |
          set +e
          out="$(REPO_DIR="$GITHUB_WORKSPACE" OUT_DIR="$RUNNER_TEMP/pull-test" SCAN_PATH=fixture \
            BETTERLEAKS_IMAGE=ghcr.io/betterleaks/betterleaks:v0.0.0-does-not-exist \
            PULL_ATTEMPTS=2 PULL_DELAY=1 GITHUB_OUTPUT="$RUNNER_TEMP/pull-test.out" \
            betterleaks/scripts/scan.sh 2>&1)"
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0 || { echo "expected a failure"; exit 1; }
          grep -q 'infrastructure problem, not a leak' <<<"$out"
          test "$(grep -c 'retrying' <<<"$out")" = "1"
          ! grep -q '^result=' "$RUNNER_TEMP/pull-test.out" 2>/dev/null || { echo "a result was reported"; exit 1; }

  # Exercises the steps the scan tests skip: artifact upload, committer email
  # (sent to a throwaway Mailpit SMTP server) and the final failing step.
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # list and download this run's artifacts
    services:
      mailpit:
        image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
    env:
      ARTIFACT: betterleaks-report-test-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create fixture repo with a fake leak in the latest commit
        run: betterleaks/tests/make-fixture.sh fixture

      - name: Wait for Mailpit
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "Mailpit not ready"; exit 1

      - name: Scan with upload, email and fail-on-leak (expected to fail)
        id: notify
        continue-on-error: true
        uses: ./betterleaks
        with:
          mode: git
          path: fixture
          artifact-name: ${{ env.ARTIFACT }}
          smtp-url: localhost
          smtp-port: "1025"
          smtp-email: betterleaks@example.com
          smtp-password: ${{ github.run_id }} # Mailpit accepts any login
          # The fixture commit is not on GitHub and the token is read-only, so
          # the comment fails: the result and the email must be unaffected.
          mention-author: "true"

      - name: Assert the job would fail
        env:
          OUTCOME: ${{ steps.notify.outcome }}
        run: test "$OUTCOME" = "failure" || { echo "expected failure, got $OUTCOME"; exit 1; }

      - name: Assert email sent to the committer
        run: |
          msgs="$(curl -sf http://localhost:8025/api/v1/messages)"
          test "$(jq '.total' <<<"$msgs")" = "1" || { echo "expected 1 email"; jq . <<<"$msgs"; exit 1; }
          jq -e '.messages[0].To[0].Address == "test@example.com"' <<<"$msgs"
          jq -e '.messages[0].Subject | startswith("[Betterleaks] Secret scan failed in ")' <<<"$msgs"
          id="$(jq -r '.messages[0].ID' <<<"$msgs")"
          text="$(curl -sf "http://localhost:8025/api/v1/message/$id" | jq -r .Text)"
          echo "$text"
          grep -q 'github-pat at values.yaml:2' <<<"$text" || { echo "finding missing from email"; exit 1; }
          ! grep -q 'ghp_' <<<"$text" || { echo "token not redacted in email"; exit 1; }
          grep -q "^Commit: $(git -C fixture rev-parse HEAD)" <<<"$text" || { echo "email does not name the scanned commit"; exit 1; }

      - name: Assert report artifact uploaded and redacted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          id="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT\") | .id")"
          test -n "$id" || { echo "artifact $ARTIFACT not found"; exit 1; }
          gh api "repos/$REPO/actions/artifacts/$id/zip" > report.zip
          unzip -p report.zip betterleaks-report.json > report.json
          jq -e 'any(.[]; .RuleID == "github-pat")' report.json
          ! grep -q 'ghp_' report.json || { echo "token not redacted in artifact"; exit 1; }

      # Web-UI style commit: committer noreply@github.com, author a GitHub
      # no-reply address. Must not be mailed; fallback-email is used instead.
      - name: Add leaking commit with only no-reply addresses
        working-directory: fixture
        env:
          GIT_AUTHOR_EMAIL: 12345+someone@users.noreply.github.com
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          echo "token: ghp_$(head -c 400 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > web.yaml
          git add web.yaml && git commit -qm "web UI commit"

      - name: "no-reply commit: scan with fallback-email"
        id: fallback
        continue-on-error: true
        uses: ./betterleaks
        with:
          mode: git
          path: fixture
          upload-report: "false"
          smtp-url: localhost
          smtp-port: "1025"
          smtp-email: betterleaks@example.com
          smtp-password: ${{ github.run_id }} # Mailpit accepts any login
          fallback-email: security-team@example.com

      - name: "no-reply commit: assert email went to the fallback only"
        run: |
          msgs="$(curl -sf http://localhost:8025/api/v1/messages)"
          test "$(jq '.total' <<<"$msgs")" = "2" || { echo "expected 2 emails in total"; jq '.messages[] | {To, Subject}' <<<"$msgs"; exit 1; }
          jq -e '.messages[0].To[0].Address == "security-team@example.com"' <<<"$msgs"
          ! jq -e 'any(.messages[].To[].Address; test("noreply"; "i"))' <<<"$msgs" || { echo "mailed a no-reply address"; exit 1; }

      - name: "no-reply commit: scan without fallback-email"
        id: nofallback
        continue-on-error: true
        uses: ./betterleaks
        with:
          mode: git
          path: fixture
          upload-report: "false"
          smtp-url: localhost
          smtp-port: "1025"
          smtp-email: betterleaks@example.com
          smtp-password: ${{ github.run_id }} # Mailpit accepts any login

      - name: "no-reply commit: assert no email and the job still fails"
        env:
          OUTCOME: ${{ steps.nofallback.outcome }}
        run: |
          test "$OUTCOME" = "failure" || { echo "expected failure, got $OUTCOME"; exit 1; }
          test "$(curl -sf http://localhost:8025/api/v1/messages | jq '.total')" = "2" \
            || { echo "expected no new email"; exit 1; }
