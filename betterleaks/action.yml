name: Betterleaks secret scan
description: >-
  Scan for secrets with Betterleaks using the shared EEA rules plus the
  repository's own config, upload a redacted JSON report, email the committer
  when leaks are found, and fail the job.

inputs:
  mode:
    description: >-
      `dir` scans the files in the checkout (whole tree). `git` scans commits
      selected by `log-opts` (default: only the latest commit).
    default: dir
  path:
    description: Repository path to scan, relative to GITHUB_WORKSPACE.
    default: "."
  config:
    description: >-
      Repository config file, relative to `path`. Optional. Its allowlists and
      rules are layered on top of the shared EEA base config.
    default: .gitleaks.toml
  base-config:
    description: >-
      Apply the shared EEA base config (betterleaks/config/eea-base.toml).
      Set to `false` to use only the repository config (or Betterleaks defaults).
    default: "true"
  baseline:
    description: >-
      Known findings to ignore (a Betterleaks JSON report), relative to `path`.
      Used when the file exists; only new findings then fail. Create it with
      `betterleaks/tests/scan-local.sh <repo> dir --write-baseline`. Empty disables.
    default: .betterleaks-baseline.json
  timeout-minutes:
    description: >-
      Scan time limit. A scan that does not finish fails as an error (never as
      a clean result).
    default: "15"
  log-opts:
    description: git log options selecting the commits to scan in `git` mode.
    default: "-1"
  fail-on-leak:
    description: Fail the job when leaks are found.
    default: "true"
  upload-report:
    description: Upload the JSON report as a workflow artifact.
    default: "true"
  artifact-name:
    description: Name of the uploaded report artifact.
    default: betterleaks-report
  smtp-url:
    description: SMTP server. Email notification is skipped when empty.
    default: ""
  smtp-port:
    description: SMTP port (465 uses implicit TLS).
    default: "25"
  smtp-email:
    description: SMTP username, also used as the From address.
    default: ""
  smtp-password:
    description: SMTP password.
    default: ""
  fallback-email:
    description: >-
      Recipient when no deliverable committer address is found (commit
      emails are GitHub no-reply addresses and the GitHub profile has no
      public email). Typically a team address from an org variable.
    default: ""

outputs:
  result:
    description: "`clean` or `leaks`. Invalid input, image pull failures and scanner errors fail the step instead."
    value: ${{ steps.scan.outputs.result }}
  leaks:
    description: Number of findings.
    value: ${{ steps.scan.outputs.leaks }}
  exit-code:
    description: Betterleaks exit code (0 = clean, 1 = leaks).
    value: ${{ steps.scan.outputs.exit-code }}
  report-path:
    description: Absolute path of the JSON report (under RUNNER_TEMP, not in the workspace).
    value: ${{ steps.scan.outputs.report-path }}
  commit:
    description: Commit that was scanned (HEAD of `path`).
    value: ${{ steps.scan.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Run Betterleaks
      id: scan
      shell: bash
      env:
        # Pinned by tag and digest. Bumped by .github/workflows/betterleaks-update.yml.
        BETTERLEAKS_IMAGE: ghcr.io/betterleaks/betterleaks:v1.9.0@sha256:e3b95b0db6c2735db17165c009b0ad6d9cef34fb4578659232b98f69d7346cac
        REPO_DIR: ${{ github.workspace }}
        OUT_DIR: ${{ runner.temp }}/betterleaks
        SCAN_PATH: ${{ inputs.path }}
        MODE: ${{ inputs.mode }}
        LOG_OPTS: ${{ inputs.log-opts }}
        CONFIG: ${{ inputs.config }}
        BASE_CONFIG: ${{ inputs.base-config }}
        BASELINE: ${{ inputs.baseline }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        FAIL_ON_LEAK: ${{ inputs.fail-on-leak }}
        UPLOAD_REPORT: ${{ inputs.upload-report }}
      run: '"$GITHUB_ACTION_PATH/scripts/scan.sh"'

    - name: Upload Betterleaks report
      if: always() && inputs.upload-report == 'true' && steps.scan.outputs.report-path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.scan.outputs.report-path }}
        if-no-files-found: ignore

    - name: Build email summary
      id: summary
      if: steps.scan.outputs.result == 'leaks' && inputs.smtp-url != '' && inputs.smtp-email != ''
      shell: bash
      env:
        REPORT: ${{ steps.scan.outputs.report-path }}
      run: |
        set -euo pipefail
        summary="$RUNNER_TEMP/betterleaks-summary.txt"
        jq -r '
          def one_line:
            tostring
            | gsub("[\r\n]+"; " ")
            | if length > 240 then .[0:240] + "..." else . end;

          .[:20][]
          | "- " + (.RuleID // "unknown-rule")
            + " at " + (.File // "unknown-file")
            + ":" + ((.StartLine // 0) | tostring)
            + "\n  match: " + ((.Match // .Secret // "REDACTED") | one_line)
        ' "$REPORT" > "$summary"

        count="$(jq 'length' "$REPORT")"
        if (( count > 20 )); then
          printf '\n... and %d more finding(s). Download the artifact for full details.\n' \
            "$((count - 20))" >> "$summary"
        fi

        # Random delimiter: the summary contains text from the scanned commits.
        delim="EOF_$(openssl rand -hex 16)"
        {
          echo "text<<$delim"
          cat "$summary"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve committer email
      id: committer
      if: steps.summary.outcome == 'success'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        COMMIT: ${{ steps.scan.outputs.commit }}
        FALLBACK: ${{ inputs.fallback-email }}
      run: |
        set -euo pipefail

        # A usable address is well-formed and not a no-reply address
        # (noreply@github.com, <id>+<login>@users.noreply.github.com, no-reply@...).
        deliverable() {
          local address="${1,,}"
          [[ "$address" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || return 1
          [[ "$address" != *noreply* && "$address" != *no-reply* ]]
        }

        email=""
        found_via=""
        for candidate in "committer:$(git log -1 --format='%ce')" "author:$(git log -1 --format='%ae')"; do
          if deliverable "${candidate#*:}"; then
            email="${candidate#*:}"
            found_via="${candidate%%:*}"
            break
          fi
        done

        # Web-UI commits and private-email users only carry no-reply addresses:
        # try the public email on the commit author's GitHub profile.
        if [[ -z "$email" && -n "$COMMIT" ]]; then
          login="$(gh api "repos/$REPO/commits/$COMMIT" --jq '.author.login // empty' 2>/dev/null || true)"
          if [[ -n "$login" ]]; then
            profile="$(gh api "users/$login" --jq '.email // empty' 2>/dev/null || true)"
            if deliverable "$profile"; then
              email="$profile"
              found_via="GitHub profile of $login"
            fi
          fi
        fi

        if [[ -z "$email" && -n "$FALLBACK" ]]; then
          if deliverable "$FALLBACK"; then
            email="$FALLBACK"
            found_via="fallback-email"
          else
            echo "::warning::fallback-email '$FALLBACK' is not a deliverable address; ignored."
          fi
        fi

        if [[ -n "$email" ]]; then
          echo "Notifying $email ($found_via)."
        else
          echo "::warning::No deliverable email for the committer (no-reply addresses, no public profile email) and no fallback-email set; no notification sent."
        fi
        echo "email=$email" >> "$GITHUB_OUTPUT"

    - name: Email committer
      if: steps.committer.outputs.email != ''
      uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
      with:
        server_address: ${{ inputs.smtp-url }}
        server_port: ${{ inputs.smtp-port }}
        secure: ${{ inputs.smtp-port == '465' }}
        username: ${{ inputs.smtp-email }}
        password: ${{ inputs.smtp-password }}
        from: ${{ inputs.smtp-email }}
        to: ${{ steps.committer.outputs.email }}
        subject: "[Betterleaks] Secret scan failed in ${{ github.repository }}"
        body: |
          Betterleaks detected one or more potential secrets.

          Repository: ${{ github.repository }}
          Branch: ${{ github.head_ref || github.ref_name }}
          Commit: ${{ steps.scan.outputs.commit || github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Findings:
          ${{ steps.summary.outputs.text }}

          Download the ${{ inputs.artifact-name }} artifact from the workflow run for details.

    - name: Fail if Betterleaks found leaks
      if: steps.scan.outputs.result == 'leaks' && inputs.fail-on-leak == 'true'
      shell: bash
      env:
        LEAKS: ${{ steps.scan.outputs.leaks }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        echo "::error::Betterleaks found $LEAKS potential secret(s). Download the $ARTIFACT_NAME artifact from this workflow run for details."
        exit 1
